name: Formatta modal account e verifica aggiornamento UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-account-password-ui.yml

permissions:
  contents: write

concurrency:
  group: account-password-ui-main
  cancel-in-progress: false

jobs:
  format-check-and-document:
    if: github.repository == 'ale3000ale/Heat-pedal-to-the-roguelike' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verifica candidato autorizzato
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '315052af96cff4c0d906d7347f3b1439ffb6fd9f'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa dal lockfile senza aggiornare dipendenze
        working-directory: frontend
        run: npm ci
      - name: Formatta soltanto il componente segnalato
        working-directory: frontend
        run: |
          ./node_modules/.bin/prettier --write src/lib/components/account-settings.svelte
          ./node_modules/.bin/prettier --check src/lib/components/account-settings.svelte
      - name: Controllo dei tipi
        working-directory: frontend
        run: npm run check
      - name: Lint e formattazione completi senza esclusioni
        working-directory: frontend
        run: npm run lint
      - name: Test frontend inclusi i test UI presenti
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Riallinea i documenti dopo i controlli riusciti
        env:
          VERIFIED_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const run = process.env.VERIFIED_RUN_ID;
          const source = process.env.GITHUB_SHA;
          if (!/^\d+$/.test(run) || !/^[0-9a-f]{40}$/.test(source)) throw new Error('Identificativi CI non validi');
          const paths = [
            'README.md', 'docs/PROJECT_SPEC.md', 'docs/PROJECT_STATUS.md',
            'docs/SETUP.md', 'docs/DATABASE.md', 'docs/SCRIPTS.md',
            'docs/PROJECT_NOTES.md', 'docs/BACKEND_AUTH.md',
            'docs/FRONTEND_AUTH.md', 'docs/ACCOUNT_SETTINGS.md', 'frontend/README.md'
          ];
          const start = '<!-- account-password-ui-current:start -->';
          const end = '<!-- account-password-ui-current:end -->';
          const block = [
            start,
            '## Aggiornamento grafico impostazioni e login - 24 ottobre 2026',
            '',
            'Nel modal Impostazioni account la sezione Cambio password e a scomparsa e inizialmente chiusa a ogni nuova apertura. La chiusura della sezione svuota i campi. In login e nei tre campi del cambio password e disponibile Mostra/Nascondi, indipendente per ogni campo e nascosto inizialmente. La visibilita non viene salvata; il componente dedicato password-input.svelte e riusato nei due contesti. Durante le richieste i controlli relativi sono disabilitati. Backend, API, database e comportamento di revoca delle altre sessioni restano invariati.',
            '',
            `Il fallimento Prettier su account-settings.svelte e stato affrontato applicando il formatter del lockfile solo a quel componente. Prima di questo riallineamento sono riusciti sul runner: npm run check, npm run lint, npm test e npm run build. Run ${run}, checkout ${source}, con componente formattato prima delle verifiche. Il successivo commit pubblica quello stile e questi documenti; non e una nuova esecuzione della CI sul commit risultante. Nessun test locale o conteggio inventato.`,
            '',
            'I test password-ui.spec.ts presenti nel candidato sono controlli di rendering server, non prove interattive di clic, tastiera o browser. Restano da verificare manualmente espansione/richiusura, reset alla riapertura e Mostra/Nascondi nei quattro campi. Nessuna migrazione, nuova dipendenza, modifica al lockfile o operazione sul DB reale.',
            end
          ].join('\n');
          const updates = paths.map(path => {
            const old = fs.readFileSync(path, 'utf8');
            const starts = old.split(start).length - 1;
            const ends = old.split(end).length - 1;
            if (starts !== ends || starts > 1 || (starts && old.indexOf(start) > old.indexOf(end))) throw new Error(`Marcatori non validi: ${path}`);
            return [path, starts
              ? old.slice(0, old.indexOf(start)) + block + old.slice(old.indexOf(end) + end.length)
              : old.trimEnd() + '\n\n' + block + '\n'];
          });
          for (const [path, value] of updates) fs.writeFileSync(path, value);
          JS
      - name: Formatta solo il README frontend aggiornato e ricontrolla lint
        working-directory: frontend
        run: |
          ./node_modules/.bin/prettier --write README.md
          npm run lint
      - name: Pubblica esclusivamente stile del componente e documenti autorizzati
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            frontend/src/lib/components/shared/account-settings.svelte
            README.md docs/PROJECT_SPEC.md docs/PROJECT_STATUS.md docs/SETUP.md
            docs/DATABASE.md docs/SCRIPTS.md docs/PROJECT_NOTES.md
            docs/BACKEND_AUTH.md docs/FRONTEND_AUTH.md docs/ACCOUNT_SETTINGS.md
            frontend/README.md
          )
          while IFS= read -r path; do
            found=0
            for item in "${allowed[@]}"; do
              if [ "$path" = "$item" ]; then found=1; break; fi
            done
            if [ "$found" != 1 ]; then echo "Modifica inattesa: $path"; exit 1; fi
          done < <(git diff --name-only)
          git add -- "${allowed[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then echo "Nessuna modifica da pubblicare"; exit 0; fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main e cambiato: nessun push eseguito"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style/docs(ui): formatta modal account e riallinea dopo CI frontend'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD
