name: Materializza backend draft

on:
  push:
    branches: [draft]
    paths: ['.github/workflows/draft-backend-materialize.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: draft-backend-materialize
  cancel-in-progress: false

jobs:
  materialize-and-check:
    if: github.repository == 'ale3000ale/Heat-pedal-to-the-roguelike' && github.ref == 'refs/heads/draft'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3c0e617f232ebd8e2c659951e4a7586904b9cbb3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recupera checkpoint approvati e materializza in staging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import urllib.request

          repository = 'ale3000ale/Heat-pedal-to-the-roguelike'
          ids = [6391973801, 6391980944, 6391993801, 6392006637, 6392014606,
                 6392026520, 6392037060, 6392047199, 6392060643, 6392086380]
          comments = []
          for key in ids:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/issues/comments/{key}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  comment = json.load(response)
              if (comment['id'] != key or comment['user']['login'] != 'ale3000ale'
                  or comment['issue_url'] != f'https://api.github.com/repos/{repository}/issues/18'
                  or comment['created_at'] != comment['updated_at']):
                  raise RuntimeError(f'Checkpoint inatteso o modificato: {key}')
              comments.append(comment)
          pattern = r'^### scripts/reconstruct_draft_backend\.py\r?\n```python\r?\n(.*?)\r?\n```'
          matches = re.findall(pattern, comments[-1]['body'], flags=re.M | re.S)
          if len(matches) != 1:
              raise RuntimeError('Ricostruttore non univoco nel checkpoint 10')
          script = matches[0] + '\n'
          anchor = '9: 6392060643,'
          if script.count(anchor) != 1:
              raise RuntimeError('Mappa checkpoint inattesa')
          script = script.replace(anchor, anchor + ' 10: 6392086380,', 1)
          scope = {'__name__': 'draft_reconstruction'}
          exec(compile(script, 'reconstruct_draft_backend.py', 'exec'), scope)
          root = Path.cwd().resolve()
          files = scope['integrate'](scope['read_base'](root), scope['checkpoint_files'](comments))
          files['scripts/reconstruct_draft_backend.py'] = script
          output = Path(os.environ['RUNNER_TEMP']) / 'draft-backend-materialized'
          output.mkdir(parents=True, exist_ok=False)
          manifest = {}
          for name, source in sorted(files.items()):
              relative = PurePosixPath(name)
              if relative.is_absolute() or '..' in relative.parts:
                  raise RuntimeError(f'Percorso non valido: {name}')
              if not (name.startswith('backend/') and name.endswith('.py')
                      or name == 'scripts/reconstruct_draft_backend.py'):
                  raise RuntimeError(f'File fuori perimetro: {name}')
              raw = source.encode('utf-8')
              staged = output / name
              staged.parent.mkdir(parents=True, exist_ok=True)
              staged.write_bytes(raw)
              target = root / name
              if not target.resolve().is_relative_to(root):
                  raise RuntimeError(f'Percorso esterno al checkout: {name}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              manifest[name] = hashlib.sha256(raw).hexdigest()
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(f'Materializzati {len(files)} file; nessun commit o push dei sorgenti')
          PY
      - name: Conserva sorgenti materializzati e manifest
        uses: actions/upload-artifact@v4
        with:
          name: draft-backend-materialized
          path: ${{ runner.temp }}/draft-backend-materialized
          if-no-files-found: error
          retention-days: 30
      - name: Installa dipendenze backend del repository
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Backend pytest sul codice materializzato
        working-directory: backend
        run: python -m pytest -q
      - name: Migrazioni soltanto sul database temporaneo del runner
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          rm -f heat.db
          alembic upgrade head
          python ../.github/scripts/check_migrations.py schema
          alembic downgrade base
          python ../.github/scripts/check_migrations.py empty
          alembic upgrade head
          python ../.github/scripts/check_migrations.py schema
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend check lint test build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run lint
          npm test
          npm run build
