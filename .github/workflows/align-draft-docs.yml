name: Allinea documenti draft dopo validazione

on:
  push:
    branches: [draft]
    paths:
      - .github/workflows/align-draft-docs.yml

permissions:
  contents: write
  checks: read

concurrency:
  group: align-draft-docs
  cancel-in-progress: false

jobs:
  align:
    name: Riallineamento documenti draft verificato
    if: github.repository == 'ale3000ale/Heat-pedal-to-the-roguelike' && github.ref == 'refs/heads/draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFIED_CODE_SHA: 8ba03aa1aa8a20f8c346b3e20b4f1352d9b2d74a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verifica base, ambito documentale e controlli riusciti
        uses: actions/github-script@v7
        with:
          script: |
            const expected = process.env.VERIFIED_CODE_SHA;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: context.sha });
            if (commit.parents.length !== 1 || commit.parents[0].sha !== expected) {
              throw new Error('Il commit di automazione non segue la base verificata: interrompo');
            }
            const files = commit.files ?? [];
            if (files.length !== 1 || files[0].filename !== '.github/workflows/align-draft-docs.yml') {
              throw new Error('Il commit iniziale contiene modifiche diverse dal workflow approvato');
            }
            const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: 'draft' });
            if (branch.commit.sha !== context.sha) throw new Error('Ramo cambiato: nessun riallineamento');
            const { data } = await github.rest.checks.listForRef({
              ...repo, ref: expected, filter: 'latest', per_page: 100
            });
            const required = [
              [121397943356, 'Frontend (check, lint, test, build)'],
              [121397944224, 'runtime'],
              [121397943569, 'Backend (pytest)'],
              [121397943562, 'Migrazioni (database di test)']
            ];
            for (const [id, name] of required) {
              const check = data.check_runs.find(item => item.id === id && item.name === name);
              if (!check || check.head_sha !== expected || check.status !== 'completed' || check.conclusion !== 'success') {
                throw new Error(`Verifica richiesta non confermata: ${name}`);
              }
              core.info(`${name}: success sul codice ${expected}`);
            }
      - name: Prepara i documenti preservando contenuti e marcatori storici
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const sha = process.env.VERIFIED_CODE_SHA;
            const targets = [
              ['README.md', 'docs/DRAFT_VALIDATION.md', 'Base funzionale della draft confermata; le modifiche grafiche successive non sono ancora iniziate.'],
              ['docs/PROJECT_SPEC.md', 'DRAFT_VALIDATION.md', 'Questo checkpoint aggiorna lo stato implementativo della draft, non modifica requisiti, regole o schema approvati.'],
              ['docs/PROJECT_STATUS.md', 'DRAFT_VALIDATION.md', 'Il ciclo dei reset UI della draft e chiuso con esito positivo riferito dall autore; altre fasi e attivita indipendenti non sono chiuse automaticamente.'],
              ['docs/SETUP.md', 'DRAFT_VALIDATION.md', 'Nessun comando di setup, prerequisito o procedura di avvio viene modificato da questo riallineamento.'],
              ['docs/SCRIPTS.md', 'DRAFT_VALIDATION.md', 'Il workflow align-draft-docs.yml riallinea solo documenti su draft dopo verifiche e controlli di concorrenza; non esegue setup, reset, backup o migrazioni.'],
              ['docs/DATABASE.md', 'DRAFT_VALIDATION.md', 'Nessun accesso o modifica al database reale, nessuna nuova analisi SQLite e nessuna migrazione eseguita da questo riallineamento; il job migrazioni citato riguarda un database di test.'],
              ['docs/PROJECT_NOTES.md', 'DRAFT_VALIDATION.md', 'I checkpoint negativi precedenti restano come cronologia e non descrivono piu lo stato corrente del ciclo di reset UI della draft.'],
              ['frontend/README.md', '../docs/DRAFT_VALIDATION.md', 'Scaffold, codice frontend, dipendenze e lockfile restano invariati in questo riallineamento.'],
              ['docs/DRAFT_SPEC.md', 'DRAFT_VALIDATION.md', 'Le regole funzionali della specifica restano invariate; vengono aggiornate soltanto le note di stato e verifica.'],
              ['docs/DRAFT_FRONTEND_STATUS.md', 'DRAFT_VALIDATION.md', 'Il collaudo negativo delle 05:09 e superato dal riscontro positivo delle 05:31 dopo la correzione lifecycle 8ba03aa1; le sezioni precedenti restano checkpoint storici.']
            ];
            const start = '<!-- draft-validation-current:start -->';
            const end = '<!-- draft-validation-current:end -->';
            const oldDate = "Data: 2026-10-25. Specifica ricavata dalle richieste e conferme dell'autore. Ramo: draft. Integrazione frontend pubblicata successivamente al consolidamento; correzione attuale e collaudo browser da verificare. Questa specifica aggiorna le regole precedenti solo per il flusso qui descritto.";
            const newDate = "Data della specifica: 2026-10-25. Aggiornamento dello stato: 2026-10-26. Specifica ricavata dalle richieste e conferme dell'autore. Ramo: draft. Implementazione integrata e correzione lifecycle verificata dalla CI sul commit 8ba03aa1aa8a20f8c346b3e20b4f1352d9b2d74a, con collaudo manuale positivo riferito dall'autore. Questa specifica aggiorna le regole precedenti solo per il flusso qui descritto.";
            const oldVerification = 'La provenienza del consolidamento e storica. Le verifiche frontend/runtime/migrazioni gia lette sul commit 26c5faabd4427f790dbdab0cf367cce7466829c6 non attestano questa correzione backend; a quella lettura pytest era ancora in corso. Non e stato letto qui un nuovo esito backend. Nessun nuovo test locale o collaudo browser dichiarato per la patch attuale.';
            const newVerification = 'Sul commit 8ba03aa1aa8a20f8c346b3e20b4f1352d9b2d74a sono stati letti con successo frontend (check, lint, test, build), runtime, backend pytest e migrazioni su database di test. Il 26 ottobre alle 05:31 l autore ha riferito che ora funziona tutto senza errori, dopo il collaudo negativo delle 05:09 e la correzione del lifecycle. Non sono attestati test locali dell assistente, conteggi o una matrice completa di browser/dispositivi. Evidenze e limiti in DRAFT_VALIDATION.md. Il manifesto backend resta la provenienza storica del consolidamento, non un manifesto degli hash del codice corrente.';
            function replaceKnown(text, before, after) {
              const count = text.split(before).length - 1;
              if (count === 1) return text.replace(before, after);
              if (count === 0 && text.split(after).length - 1 === 1) return text;
              throw new Error('Ancora della specifica assente o ambigua');
            }
            function align(path, original, guide, scope) {
              let text = original;
              if (path === 'docs/DRAFT_SPEC.md') {
                text = replaceKnown(text, oldDate, newDate);
                text = replaceKnown(text, oldVerification, newVerification);
              }
              const starts = text.split(start).length - 1;
              const ends = text.split(end).length - 1;
              if (starts !== ends || starts > 1 || (starts && text.indexOf(start) > text.indexOf(end))) {
                throw new Error(`Marcatori di riallineamento non validi: ${path}`);
              }
              const block = [
                start, '', '## Draft - stato verificato del 26 ottobre 2026', '',
                'Questa sezione prevale esclusivamente sulle precedenti note di stato e verifica del flusso draft. Regole, specifiche delle altre fasi e contenuti storici restano conservati.', '',
                `Base funzionale: commit ${sha}, ramo draft, PR #18 ancora in bozza e senza merge in main. Correzione delle chiavi del flusso e della proprieta delle risorse UI, non una nuova modifica di regole o API.`, '',
                'Verifiche lette: frontend (check, lint, test, build), runtime, backend pytest e migrazioni su database di test tutti success. Run CI 40269135082 e runtime 40269135447. I due job documentali di fase 16 sono skipped, non falliti.', '',
                'Collaudo manuale positivo riferito dall autore il 26 ottobre alle 05:31: ora funziona tutto senza errori. Il riscontro segue i reset di presenze, zoom e mazzi e la correzione lifecycle. Non e un test browser automatizzato o una certificazione di tutti i dispositivi.', '',
                scope, '',
                'Questo riallineamento non cambia codice applicativo, dipendenze, lockfile o dati e non esegue nuovi test dell applicazione. Nessun rilascio, ZIP finale o merge implicito. Interventi grafici successivi sospesi fino alla scelta dell autore.', '',
                `[Evidenze, cronologia e limiti della validazione](${guide}).`, end
              ].join('\n');
              if (starts) return text.slice(0, text.indexOf(start)) + block + text.slice(text.indexOf(end) + end.length);
              const heading = /^# [^\r\n]+(?:\r?\n|$)/m.exec(text);
              if (!heading) throw new Error(`Titolo principale assente: ${path}`);
              const position = heading.index + heading[0].length;
              return text.slice(0, position) + '\n' + block + '\n' + text.slice(position);
            }
            const sample = '# Prova\n\nTesto da conservare.\n';
            const alignedSample = align('README.md', sample, 'docs/DRAFT_VALIDATION.md', 'Ambito prova.');
            if (align('README.md', alignedSample, 'docs/DRAFT_VALIDATION.md', 'Ambito prova.') !== alignedSample || !alignedSample.endsWith('\nTesto da conservare.\n')) {
              throw new Error('Autoverifica di idempotenza o conservazione fallita');
            }
            const updates = targets.map(([path, guide, scope]) => {
              const stat = fs.lstatSync(path);
              if (!stat.isFile() || stat.isSymbolicLink()) throw new Error(`Percorso documentale non regolare: ${path}`);
              const original = fs.readFileSync(path, 'utf8');
              const updated = align(path, original, guide, scope);
              if (align(path, updated, guide, scope) !== updated) throw new Error(`Aggiornamento non idempotente: ${path}`);
              return [path, updated];
            });
            const reportPath = 'docs/DRAFT_VALIDATION.md';
            const report = [
              '# Draft - validazione e chiusura del ciclo funzionale', '',
              '26 ottobre 2026. Repository Heat-pedal-to-the-roguelike, ramo draft, PR #18 in bozza. Nessun merge in main.', '',
              '## Base verificata', '',
              `Commit applicativo: ${sha}. Il successivo riallineamento e documentale e non cambia il comportamento dell app.`, '',
              'La correzione stabilizza le chiavi del flusso per generazione autenticata e ID preparazione e corregge la proprieta delle risorse: il registro possiede lo store principale, il contesto possiede il coordinatore mazzi e la vista pulisce solo le risorse UI locali.', '',
              '## Evidenze CI', '',
              '- [Frontend: check, lint, test e build](https://github.com/ale3000ale/Heat-pedal-to-the-roguelike/actions/runs/40269135082/job/121397943356): success.',
              '- [Backend pytest](https://github.com/ale3000ale/Heat-pedal-to-the-roguelike/actions/runs/40269135082/job/121397943569): success.',
              '- [Migrazioni sul database di test](https://github.com/ale3000ale/Heat-pedal-to-the-roguelike/actions/runs/40269135082/job/121397943562): success.',
              '- [Runtime](https://github.com/ale3000ale/Heat-pedal-to-the-roguelike/actions/runs/40269135447/job/121397944224): success.', '',
              'I due job documentali di fase 16 sono skipped per questo ramo; non sono controlli falliti. Non vengono inventati conteggi di test o warning. Il workflow documentale ricontrolla gli ID, lo SHA e le conclusioni prima di aggiornare i file.', '',
              '## Collaudo riferito dall autore', '',
              'Alle 05:09 del 26 ottobre l autore ha segnalato ancora riduzione dello zoom, reset dei mazzi e ritorno alla scelta iniziale quando escludeva un pilota. Le precedenti patch di layout, focus e scroll non erano quindi una soluzione verificata.', '',
              'Dopo la correzione lifecycle 8ba03aa1, alle 05:31 l autore ha riferito: "ok ora funziona tutto senza errori" e ha chiesto di passare alla grafica. Questo riscontro chiude positivamente il ciclo delle segnalazioni UI nel collaudo riferito. Non equivale a una prova browser eseguita dall assistente, a una matrice completa mobile/desktop o alla verifica indipendente di ogni criterio della specifica.', '',
              '## Regole e dati preservati', '',
              'La specifica funzionale resta [DRAFT_SPEC.md](DRAFT_SPEC.md). Il controllo delle 15 carte non torna alle presenze: si applica dopo modifica del mazzo ai READY e nel ricontrollo finale, con eccezione della prima gara e massimo gia previsti. Nessuna nuova migrazione o operazione sul DB reale eseguita da questo riallineamento.', '',
              'La provenienza backend in DRAFT_BACKEND_MANIFEST.json resta storica e non descrive gli hash di tutte le correzioni successive. Gli errori precedenti di lint e tipi restano nella cronologia, non come stato corrente.', '',
              '## Stato successivo', '',
              'Il 26 ottobre alle 17:29 l autore ha richiesto prima il riallineamento dei documenti. Le modifiche grafiche non sono ancora definite o iniziate. Altre fasi, domande aperte, release, ZIP finale e merge non sono chiusi o autorizzati automaticamente da questo checkpoint.', '',
              'Questo documento e i blocchi correnti nei documenti generali separano risultati CI, collaudo riferito e limiti residui. Nessun nuovo test locale dell applicazione eseguito per il solo riallineamento.', ''
            ].join('\n');
            if (fs.existsSync(reportPath)) {
              const stat = fs.lstatSync(reportPath);
              if (!stat.isFile() || stat.isSymbolicLink() || fs.readFileSync(reportPath, 'utf8') !== report) {
                throw new Error('Documento di validazione esistente diverso da quello approvato');
              }
            }
            updates.push([reportPath, report]);
            for (const [path, updated] of updates) fs.writeFileSync(path, updated, 'utf8');
            core.info(`Preparati ${updates.length} documenti; autoverifiche documentali superate, nessun test applicativo eseguito`);
      - name: Pubblica solo gli undici Markdown senza sovrascrivere altri aggiornamenti
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              README.md|docs/PROJECT_SPEC.md|docs/PROJECT_STATUS.md|docs/SETUP.md|docs/SCRIPTS.md|docs/DATABASE.md|docs/PROJECT_NOTES.md|frontend/README.md|docs/DRAFT_SPEC.md|docs/DRAFT_FRONTEND_STATUS.md|docs/DRAFT_VALIDATION.md) ;;
              *) echo "Modifica inattesa: $path"; exit 1 ;;
            esac
          done < <( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )
          git add -- README.md docs/PROJECT_SPEC.md docs/PROJECT_STATUS.md docs/SETUP.md docs/SCRIPTS.md docs/DATABASE.md docs/PROJECT_NOTES.md frontend/README.md docs/DRAFT_SPEC.md docs/DRAFT_FRONTEND_STATUS.md docs/DRAFT_VALIDATION.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Documenti gia allineati.'
            exit 0
          fi
          git fetch origin draft
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/draft)" ]; then
            echo 'Ramo cambiato: nessun push eseguito.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: allinea draft a CI verde e collaudo positivo'
          git push origin HEAD:refs/heads/draft
          echo "Commit documentale pubblicato: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
