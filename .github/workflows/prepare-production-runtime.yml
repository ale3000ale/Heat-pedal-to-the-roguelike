name: Validate prepared production runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate committed dependencies without updates or pushes
        working-directory: frontend
        run: |
          npm ci
          npm ls @sveltejs/adapter-node @sveltejs/kit
          npm run check
          npm run lint
          npm test
          npm run build
