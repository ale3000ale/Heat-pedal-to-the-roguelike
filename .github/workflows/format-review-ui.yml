name: Formatta protezione chiusura modal fase 16

on:
  push:
    branches: [phase-16-admin-pilot-inventory]
    paths:
      - .github/workflows/format-review-ui.yml

permissions:
  contents: write

concurrency:
  group: format-admin-cards-phase-16
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'ale3000ale/Heat-pedal-to-the-roguelike' && github.ref == 'refs/heads/phase-16-admin-pilot-inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa dal lockfile
        working-directory: frontend
        run: npm ci
      - name: Formatta soltanto i tre file approvati
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/lib/modal-close.ts
            src/lib/modal-close.spec.ts
            src/lib/components/modal.svelte
          )
          ./node_modules/.bin/prettier --write "${files[@]}"
          ./node_modules/.bin/prettier --check "${files[@]}"
      - name: Controllo dei tipi
        working-directory: frontend
        run: npm run check
      - name: Lint e formattazione completi
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Pubblica solo la formattazione approvata
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- backend database heat.py frontend/package.json frontend/package-lock.json frontend/prettier.config.js .github/workflows
          files=(
            frontend/src/lib/modal-close.ts
            frontend/src/lib/modal-close.spec.ts
            frontend/src/lib/components/modal.svelte
          )
          git add -- "${files[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nessuna modifica di formattazione necessaria."
            exit 0
          fi
          git fetch origin phase-16-admin-pilot-inventory
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/phase-16-admin-pilot-inventory)" ]; then
            echo "Il ramo e' cambiato: nessun push eseguito."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: formatta la protezione chiusura modal con il lockfile'
          git push origin HEAD:refs/heads/phase-16-admin-pilot-inventory
