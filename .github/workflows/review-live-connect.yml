          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Formatta e verifica frontend dal lockfile
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npx --no-install prettier --write src/lib/stores/review-counts.svelte.ts src/lib/components/race-review-panel.svelte src/lib/review-live-integration.spec.ts
          npm run lint
          npm run check
          npm test
          npm run build
      - name: Pubblica solo il collegamento verificato
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- frontend/package.json frontend/package-lock.json frontend/prettier.config.js
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/PHASE_15_REVIEW_LIVE_CONNECT.md')
          text = p.read_text()
          old = 'Stato: applicazione e controlli ancora da verificare.'
          if text.count(old) != 1: raise RuntimeError('Nota diversa')
          p.write_text(text.replace(old, 'Stato: applicato; formatter, lint, check, test e build frontend riusciti prima del commit bot.'))
          PY
          git add -- frontend/src/lib/stores/review-counts.svelte.ts frontend/src/lib/components/race/race-review-panel.svelte frontend/src/lib/race/review/review-live-integration.spec.ts docs/PHASE_15_REVIEW_LIVE_CONNECT.md
          git diff --cached --check
          git fetch origin phase-15-sse-sistemazione
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/phase-15-sse-sistemazione)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: collega inventari revisione a SSE e merge conservativo'
          git push origin HEAD:refs/heads/phase-15-sse-sistemazione
