name: Production runtime checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Launcher and LAN unit tests without database access
        run: python -m unittest tools.test_lan tools.test_production tools.test_production_lan -v
      - name: CLI exposes production
        run: python heat.py production --help
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Types and frontend unit tests
        working-directory: frontend
        run: |
          npm run check
          npm test
      - name: Gateway and LAN proxy tests
        working-directory: frontend
        run: node --test production-server.test.mjs production-lan.test.mjs
      - name: Build standalone Node server
        working-directory: frontend
        run: npm run build
      - name: Smoke test actual standalone build
        working-directory: frontend
        env:
          HEAT_BUILD_SMOKE: '1'
        run: node --test production-server.test.mjs
      - name: Lint and formatting
        working-directory: frontend
        run: npm run lint
