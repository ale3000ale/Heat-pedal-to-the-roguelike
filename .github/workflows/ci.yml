name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un nuovo push sullo stesso branch annulla l'esecuzione precedente ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installa le dipendenze
        # pytest e httpx (usato dal TestClient di FastAPI) si aggiungono qui, nel caso
        # non siano già in requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Esegui i test
        run: python -m pytest -q

  migrations:
    name: Migrazioni (database di test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Database di test nuovo
        # Il database è un file nuovo sul runner (./heat.db): non tocca quello locale.
        run: rm -f heat.db
      - name: Upgrade fino all'ultima migrazione
        run: alembic upgrade head
      - name: Verifica tabelle, colonne e indici
        run: python ../.github/scripts/check_migrations.py schema
      - name: Downgrade fino all'inizio
        run: alembic downgrade base
      - name: Verifica database vuoto
        run: python ../.github/scripts/check_migrations.py empty
      - name: Upgrade di nuovo
        run: alembic upgrade head
      - name: Verifica finale dello schema
        run: python ../.github/scripts/check_migrations.py schema

  frontend:
    name: Frontend (check, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa le dipendenze
        run: npm ci
      - name: Controllo dei tipi
        run: npm run check
      - name: Lint e formattazione
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  phase16-docs:
    name: Documenti fase 16 dopo backend
    needs: backend
    if: github.event_name == 'pull_request' && github.repository == 'ale3000ale/Heat-pedal-to-the-roguelike' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase-16-admin-pilot-inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: phase-16-docs
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installa le dipendenze esistenti
        run: python -m pip install -r backend/requirements.txt
      - name: Esegui solo il riallineamento documentale approvato
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          import yaml

          content = Path(".github/workflows/phase-16-docs-pr.yml").read_bytes()
          blob = b"blob " + str(len(content)).encode() + b"\0" + content
          if hashlib.sha1(blob).hexdigest() != "956f1265996388699cfe05d4abf84a24f51a650a":
              raise RuntimeError("Workflow documentale diverso da quello approvato")
          step = yaml.safe_load(content)["jobs"]["align-docs-pr"]["steps"][-1]
          if step["name"] != "Riallinea i documenti dopo i test mirati":
              raise RuntimeError("Passaggio documentale inatteso")
          subprocess.run(["bash", "-e", "-o", "pipefail", "-c", step["run"]], check=True)
          PY
