name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un nuovo push sullo stesso branch annulla l'esecuzione precedente ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installa le dipendenze
        # pytest e httpx (usato dal TestClient di FastAPI) si aggiungono qui, nel caso
        # non siano già in requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Esegui i test
        run: python -m pytest -q

  frontend:
    name: Frontend (check, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa le dipendenze
        run: npm ci
      - name: Controllo dei tipi
        run: npm run check
      - name: Lint e formattazione
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
