name: Verifica e documenta cambio password account

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/account-password-checks.yml

permissions:
  contents: write

concurrency:
  group: account-password-main
  cancel-in-progress: false

jobs:
  verify-and-align:
    if: github.repository == 'ale3000ale/Heat-pedal-to-the-roguelike' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verifica candidato autorizzato
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '6dc25b32209888c32e018ecdb674447c7be6482e'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa dipendenze backend esistenti e strumenti di test
        run: python -m pip install -r backend/requirements.txt pytest httpx
      - name: Installa frontend dal lockfile
        working-directory: frontend
        run: npm ci
      - name: Formatta esclusivamente i cinque file frontend approvati
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/lib/password-change.ts
            src/lib/password-change-api.ts
            src/lib/password-change.spec.ts
            src/lib/components/account-settings.svelte
            src/routes/+layout.svelte
          )
          ./node_modules/.bin/prettier --write "${files[@]}"
          ./node_modules/.bin/prettier --check "${files[@]}"
      - name: Tutti i test backend con database delle fixture
        working-directory: backend
        run: python -m pytest -q
      - name: Controllo dei tipi frontend
        working-directory: frontend
        run: npm run check
      - name: Lint completo senza esclusioni
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Riallinea documenti solo dopo i controlli riusciti
        env:
          VERIFIED_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const run = process.env.VERIFIED_RUN_ID;
          const source = process.env.GITHUB_SHA;
          if (!/^\d+$/.test(run) || !/^[0-9a-f]{40}$/.test(source)) throw new Error('Identificativi CI non validi');
          const guide = [
            '# Impostazioni account e cambio password',
            '',
            'Funzione richiesta e sviluppata direttamente su main il 24 ottobre 2026, senza ramo o PR dedicati.',
            '',
            'Clic sul proprio nome nella barra: apre Impostazioni account con Password attuale, Nuova password e Conferma nuova password. La nuova password deve avere 8-128 caratteri e la conferma deve coincidere. Gli spazi non vengono rimossi e il conteggio segue i code point Unicode.',
            '',
            'Il pulsante Cambia password invia una sola richiesta. Durante l invio campi, doppio invio e chiusura ordinaria del modal sono bloccati. I campi locali sono svuotati dopo la richiesta e alla chiusura; nessuna password viene salvata negli store globali o nel browser storage. Una navigazione o chiusura forzata non annulla una richiesta gia inviata. Le risposte tardive non aggiornano un modal smontato o un account diverso.',
            '',
            'POST /api/auth/change-password richiede la sessione autenticata. Corpo JSON: current_password, new_password, confirm_password; campi aggiuntivi rifiutati. Le verifiche sono anche server-side. Successo 204 senza hash, password, token o nuovo cookie; 401 sessione assente/scaduta/revocata; 403 password attuale errata; 409 SQLite occupato; 422 dati o conferma non validi. La validazione Pydantic del corpo non riporta gli input negli errori del nuovo endpoint.',
            '',
            'La scelta approvata mantiene il token e la scadenza della sessione corrente e revoca le altre sessioni dello stesso account. Hash e revoche vengono salvati insieme con lock SQLite, rilettura della sessione e rollback su errore. Gli altri account non vengono modificati. Il flusso SSE esistente ricontrolla la sessione e termina con auth.expired quando rileva una revoca; non si dichiara una disconnessione istantanea di ogni dispositivo o la cancellazione di dati gia visualizzati.',
            '',
            'Password attuale errata o conferma diversa non cambiano dati. Per errore di rete o risposta server non conclusiva la UI segnala un esito incerto: nessun retry automatico e nessuna promessa di rollback. Verificare quale password risulta attiva prima di riprovare.',
            '',
            'Nessuna migrazione, nuova dipendenza o modifica di schema. La funzione modifica a runtime soltanto l hash del proprio utente e le sue altre sessioni; l assistente non ha eseguito operazioni sul database reale. Setup, avvio LAN, carte e regole del gioco restano invariati. Su LAN HTTP il traffico non e cifrato: usare esclusivamente una rete fidata.',
            '',
            `Verifiche eseguite sul runner prima di questo riallineamento: pytest backend, check frontend, lint, test frontend e build. Esecuzione ${run}, checkout ${source}, con formattazione limitata ai cinque file frontend prima dei controlli. Il checkout identifica l avvio della run; il successivo commit contiene i file formattati effettivamente verificati. Nessun conteggio complessivo o warning viene inventato. Non e un collaudo manuale browser, di rete, di concorrenza reale o una prova di tutte le condizioni di login simultaneo. Nessun test locale eseguito dall assistente.`,
            '',
            'Test aggiunti: backend/tests/test_password_change.py e frontend/src/lib/auth/password-change.spec.ts. Il backend copre ruoli, password attuale, conferma/lunghezze/campi extra, sessione conservata, altre sessioni revocate, account estranei, hash, login vecchio/nuovo, sessione scaduta/revocata, rollback simulato ed esclusione delle sessioni revocate dal polling SSE. Il frontend copre validazione, Unicode, payload, cookie, errori e assenza di retry; non costituisce test DOM del modal.',
            ''
          ].join('\n');
          const start = '<!-- account-password-current:start -->';
          const end = '<!-- account-password-current:end -->';
          const paths = [
            ['README.md', 'docs/ACCOUNT_SETTINGS.md'],
            ['docs/PROJECT_SPEC.md', 'ACCOUNT_SETTINGS.md'],
            ['docs/PROJECT_STATUS.md', 'ACCOUNT_SETTINGS.md'],
            ['docs/SETUP.md', 'ACCOUNT_SETTINGS.md'],
            ['docs/DATABASE.md', 'ACCOUNT_SETTINGS.md'],
            ['docs/SCRIPTS.md', 'ACCOUNT_SETTINGS.md'],
            ['docs/PROJECT_NOTES.md', 'ACCOUNT_SETTINGS.md'],
            ['docs/BACKEND_AUTH.md', 'ACCOUNT_SETTINGS.md'],
            ['docs/FRONTEND_AUTH.md', 'ACCOUNT_SETTINGS.md'],
            ['frontend/README.md', '../docs/ACCOUNT_SETTINGS.md']
          ];
          const updates = paths.map(([path, link]) => {
            const old = fs.readFileSync(path, 'utf8');
            const starts = old.split(start).length - 1;
            const ends = old.split(end).length - 1;
            if (starts !== ends || starts > 1 || (starts && old.indexOf(start) > old.indexOf(end))) throw new Error(`Marcatori non validi: ${path}`);
            const block = [
              start,
              '## Impostazioni account e cambio password - 24 ottobre 2026',
              '',
              'Su main: clic sul proprio nome apre Impostazioni account. Password attuale e doppio inserimento della nuova; nuova password di 8-128 caratteri, validata anche sul server. La sessione corrente resta attiva con token e scadenza invariati; le altre sessioni dello stesso account vengono revocate. Hash e revoche sono nella stessa transazione con rollback su errore. Gli altri account non cambiano.',
              '',
              'Endpoint POST /api/auth/change-password, autenticato, successo 204. Nessuna migrazione o dipendenza nuova. Nessuna modifica al DB reale eseguita dall assistente. Durante l invio niente doppio invio o chiusura ordinaria; campi svuotati dopo la richiesta e alla chiusura. Errori di rete: esito incerto e nessun retry automatico. SSE riusa il controllo periodico delle sessioni.',
              '',
              `Riallineamento dopo pytest backend, tipi, lint, test frontend e build riusciti nel runner: run ${run}, checkout ${source}, formattazione circoscritta applicata prima delle verifiche. Nessun conteggio inventato, test locale o collaudo browser attestato.`,
              '',
              `Dettagli, limiti e prove: [Impostazioni account](${link}).`,
              end
            ].join('\n');
            return [path, starts ? old.slice(0, old.indexOf(start)) + block + old.slice(old.indexOf(end) + end.length) : old.trimEnd() + '\n\n' + block + '\n'];
          });
          for (const [path, value] of updates) fs.writeFileSync(path, value);
          fs.writeFileSync('docs/ACCOUNT_SETTINGS.md', guide);
          JS
      - name: Formatta il solo README frontend aggiornato e ricontrolla lint
        working-directory: frontend
        run: |
          ./node_modules/.bin/prettier --write README.md
          npm run lint
      - name: Pubblica solo stile e documenti approvati senza sovrascrivere aggiornamenti concorrenti
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            frontend/src/lib/auth/password-change.ts frontend/src/lib/auth/password-change-api.ts
            frontend/src/lib/auth/password-change.spec.ts frontend/src/lib/components/shared/account-settings.svelte
            frontend/src/routes/+layout.svelte README.md docs/PROJECT_SPEC.md
            docs/PROJECT_STATUS.md docs/SETUP.md docs/DATABASE.md docs/SCRIPTS.md
            docs/PROJECT_NOTES.md docs/BACKEND_AUTH.md docs/FRONTEND_AUTH.md
            frontend/README.md docs/ACCOUNT_SETTINGS.md
          )
          while IFS= read -r path; do
            found=0
            for item in "${allowed[@]}"; do
              if [ "$path" = "$item" ]; then found=1; break; fi
            done
            if [ "$found" != 1 ]; then echo "Modifica inattesa: $path"; exit 1; fi
          done < <(git diff --name-only)
          git add -- "${allowed[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then echo "Nessuna modifica da pubblicare"; exit 0; fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main e cambiato: nessun push eseguito"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style/docs(account): formatta e riallinea dopo verifiche cambio password'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD
